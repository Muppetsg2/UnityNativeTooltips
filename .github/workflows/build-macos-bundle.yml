# Builds Runtime/Plugins/macOS/NativeTooltipsMac.bundle on a GitHub-hosted macOS runner and commits it,
# so the package can be maintained without a Mac.
#
# Runs automatically when the Objective-C source changes, or manually: Actions → Build macOS bundle → Run workflow.
name: Build macOS bundle

on:
  workflow_dispatch:
  push:
    paths:
      - 'Runtime/Plugins/macOS/Source~/**'

permissions:
  contents: write # to commit the built bundle

concurrency:
  group: build-macos-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build NativeTooltipsMac.bundle (universal, macOS 10.13+)
        run: |
          chmod +x "Runtime/Plugins/macOS/Source~/build_macos.sh"
          "Runtime/Plugins/macOS/Source~/build_macos.sh"

      - name: Verify architectures, minimum macOS and exported API
        run: |
          BIN="Runtime/Plugins/macOS/NativeTooltipsMac.bundle/Contents/MacOS/NativeTooltipsMac"
          lipo -info "$BIN"
          lipo "$BIN" -verify_arch arm64 x86_64
          # Minimum macOS per slice. Targets below 10.14 are stored in the older LC_VERSION_MIN_MACOSX load command
          # ("version"), newer ones in LC_BUILD_VERSION ("minos"). arm64 can't go below 11.0 (the first macOS on
          # Apple Silicon), so the linker raises it to 11.0 — expected.
          for ARCH in arm64 x86_64; do
            MIN=$(otool -arch "$ARCH" -l "$BIN" | awk '/LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX/ { f = 1 } f && $1 ~ /^(minos|version)$/ { print $2; exit }')
            echo "$ARCH: minimum macOS ${MIN:-unknown}"
            case "$ARCH:$MIN" in
              arm64:11.0|x86_64:10.13) ;;
              *) echo "::error::Unexpected minimum macOS for $ARCH: '${MIN}'"; exit 1 ;;
            esac
          done
          nm -gU "$BIN" | grep -E "NTMac_(Version|Initialize|SetToolTip|CustomPrepare|CustomShowAt|CustomHide|GetGeometry)"
          codesign --verify --verbose "Runtime/Plugins/macOS/NativeTooltipsMac.bundle"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NativeTooltipsMac.bundle
          path: |
            Runtime/Plugins/macOS/NativeTooltipsMac.bundle
            Runtime/Plugins/macOS/NativeTooltipsMac.bundle.meta

      - name: Commit the bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f Runtime/Plugins/macOS/NativeTooltipsMac.bundle Runtime/Plugins/macOS/NativeTooltipsMac.bundle.meta
          if git diff --cached --quiet; then
            echo "Bundle unchanged."
          else
            git commit -m "Build NativeTooltipsMac.bundle [skip ci]"
            git push
          fi
